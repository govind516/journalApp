spring.application.name=journal-backend
server.port=8000

# ---- Postgres (override via DB_HOST / DB_NAME / DB_USER / DB_PASSWORD) ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:journaldb}
spring.datasource.username=${DB_USER:journal}
spring.datasource.password=${DB_PASSWORD:journal}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Flyway (baseline V1__initial_schema.sql captures the ddl-auto schema;
# baseline-on-migrate lets pre-existing ddl-auto-built dev DBs adopt V1) ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.fail-on-missing-locations=true

# ---- CORS ----
app.cors.origins=http://localhost:5173

# ---- Session cookie (localhost is plain HTTP: Secure must stay false here) ----
app.cookie.secure=false
app.cookie.same-site=Lax

# ---- Rate limiting (in-memory buckets, single instance; budgets reset on restart) ----
# X-Forwarded-For is honored only when behind a trusted proxy; default off
# so clients cannot spoof their way around the per-IP budgets.
app.trust-proxy=false

# ---- Actuator (health/info only; liveness + DB readiness via the datasource) ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ---- Journal intelligence ("local" reads only your own entries on this
# machine; a future cloud/Ollama provider plugs in behind this key) ----
app.ai.provider=local

logging.level.com.journal=INFO
