# Prod profile (activate with SPRING_PROFILES_ACTIVE=prod).
# Strict cookie transport + explicit CORS allowlist.
# APP_CORS_ORIGINS_PROD has NO default — boot fails fast if unset.
app.cookie.secure=true
app.cookie.same-site=None
app.cors.origins=${APP_CORS_ORIGINS_PROD}

# Interactive API docs stay a local/dev tool — no spec or UI in prod.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
