name: CI
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  backend:
    name: Backend build and verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: journaldb
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journal -d journaldb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and verify
        run: mvn -B verify
      - name: Dependency vulnerability scan (report-only)
        # failBuildOnCVSS=11 never fails the build; findings surface in logs.
        # Add an NVD_API_KEY repo secret and pass -DnvdApiKey for faster DB updates.
        run: mvn -B org.owasp:dependency-check-maven:12.1.3:check -DfailBuildOnCVSS=11
        continue-on-error: true
  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Dependency audit (report-only)
        # continue-on-error keeps this informational until the baseline is clean.
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Build
        run: npm run build
