name: Keep backend warm

on:
  schedule:
    # 08:00-23:00 IST = 02:30-17:30 UTC. GitHub cron is UTC, so we need 3 slices.
    # Covers 08:00, 08:10, 08:20 IST then every 10 min 08:30-22:50 IST + 23:00 IST
    - cron: '30,40,50 2 * * *'
    - cron: '*/10 3-16 * * *'
    - cron: '0,10,20,30 17 * * *'
  workflow_dispatch: {} # manual wake before a demo

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 60 https://journalapp-backend-aqcv.onrender.com/actuator/health || true
