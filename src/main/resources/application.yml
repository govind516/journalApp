spring:
  profiles:
    active: dev
  data:
    mongodb:
      auto-index-creation: true

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org:
      springframework:
        security: DEBUG
        web: DEBUG
    com:
      journalApp: DEBUG

server:
  port: 8080

springdoc:
  swagger-ui:
    tagsSorter: alpha

ApiKey:
  weather: ${WEATHER_API_KEY:}
  quote: ${QUOTE_API_KEY:}
  
jwt:
  secret: ${JWT_SECRET:default-dev-secret-change-in-production}

google:
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/google/callback}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}