server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers for the static bundle. CSP ships Report-Only until
  # browser-console verification passes across all pages (then flip to
  # Content-Security-Policy). connect-src intentionally unrestricted for
  # now — tightening it needs build-time API-origin templating (phase 2).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'" always;

  # HSTS (inert until TLS termination exists — do not enable on plain HTTP;
  # no preload: one-way door, needs a canonical prod domain + full-HTTPS audit).
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Single-page app fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: proxy API to the backend service when composed together.
  # location /api/ {
  #   proxy_pass http://backend:8000;
  #   proxy_set_header Host $host;
  # }
}
