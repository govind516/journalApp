server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: proxy API to the backend service when composed together.
  # location /api/ {
  #   proxy_pass http://backend:8000;
  #   proxy_set_header Host $host;
  # }
}
